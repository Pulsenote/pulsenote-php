name: CI

# RUNNERS: defaults to GitHub-hosted `ubuntu-latest`, and moves to the self-hosted
# k3s ARC runners when the repo Variable RUNNER_LABEL is set (Settings → Secrets and
# variables → Actions → Variables) — same convention as the `pulsenote` app repo.
#
# Unlike the app repo, nothing here is hardcoded to `ubuntu-latest`: that repo pins
# its image builds to amd64 because the cluster nodes are amd64, but this package
# builds no images. It is pure PHP with no native extensions, so arm64 is equivalent.
#
# Self-hosted requirements: shivammathur/setup-php installs PHP via apt, so the
# runner needs root/sudo. It supports linux-arm64 only since Jan 2025 — older
# versions of the action fail with "Exec format error". If apt/sudo is unavailable
# on the runner image, swap setup-php for `container: php:8.3-cli` (the official
# images are multi-arch and include arm64).

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: none
          tools: composer:v2
        env:
          # setup-php takes a different install path on self-hosted runners; empty
          # (the GitHub-hosted case) is the same as leaving it unset.
          runner: ${{ vars.RUNNER_LABEL && 'self-hosted' || '' }}

      - name: Install dependencies
        # The lock file is not committed (this is a library), so resolve fresh per PHP version.
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: Tests
        run: vendor/bin/phpunit

  lowest:
    name: Lowest dependencies
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer:v2
        env:
          runner: ${{ vars.RUNNER_LABEL && 'self-hosted' || '' }}

      # Catches version constraints that are wider than what the code actually supports.
      - run: composer update --prefer-lowest --prefer-dist --no-interaction --no-progress

      - run: vendor/bin/phpunit
