name: Spec drift
"on":
  schedule:
    - cron: "0 6 * * 1" # Mondays, matching the Node SDK's regeneration cadence
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
        env:
          runner: ${{ vars.RUNNER_LABEL && 'self-hosted' || '' }}

      - run: composer update --prefer-dist --no-interaction --no-progress

      # Default to the PUBLIC spec, which is what fetch-spec.php uses too.
      # This used to point at the internal sysgp.eu host, which no longer
      # resolves — so every scheduled run since then died on the fetch and this
      # guard has been checking nothing while reporting a failure that looked
      # like drift. A guard whose failure means "I could not run" is worse than
      # no guard: it trains you to ignore the red.
      - name: Refresh the committed spec
        run: php scripts/fetch-spec.php
        env:
          SPEC_URL: ${{ vars.PULSENOTE_SPEC_URL || 'https://pulsenote.eu/openapi.json' }}

      - name: Diff the SDK against it
        id: drift
        continue-on-error: true
        run: vendor/bin/phpunit --filter SpecCoverageTest

      # A PR is opened whenever the spec moved. If the SDK also needs new methods the
      # drift test is red on that PR — the failure output lists exactly which operations.
      - name: Open a PR with the spec change
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/spec-refresh
          title: "chore: refresh OpenAPI spec"
          commit-message: "chore: refresh OpenAPI spec"
          body: |
            Automated refresh of `openapi/pulsenote-api.json` from the live API.

            `SpecCoverageTest` result on this run: **${{ steps.drift.outcome }}**.

            If it failed, the CI log lists the operations this SDK does not yet
            implement — see CONTRIBUTING.md for how to add them.
          labels: sdk, automated
