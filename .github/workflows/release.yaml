name: Release

# Dispatched by release-please (see release-please.yaml) against the tag it just
# created. The `release: published` trigger was deliberately REMOVED: a Release
# created with GITHUB_TOKEN emits no such event, so it never fired for an
# automated release. Run it by hand against a tag to re-verify.
#
# Note this cannot gate anything — Packagist publishes straight off the tag via
# its webhook. It reports whether the tag that just went public is sound.
"on":
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
        env:
          runner: ${{ vars.RUNNER_LABEL && 'self-hosted' || '' }}

      - run: composer validate --strict

      - run: composer update --prefer-dist --no-interaction --no-progress

      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - run: vendor/bin/phpunit

      # Packagist resolves versions from git tags, so a tag that disagrees with
      # Pulsenote::VERSION would ship a wrong User-Agent to every customer.
      # Only meaningful when dispatched at a version tag; a deliberate run against
      # a branch skips it.
      - name: Tag must match Pulsenote::VERSION
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "Ref $GITHUB_REF_NAME is not a version tag — skipping the match check."
            exit 0
          fi
          SRC=$(php -r 'require "src/Pulsenote.php"; echo Pulsenote\Pulsenote::VERSION;')
          if [ "$TAG" != "$SRC" ]; then
            echo "::error::tag $TAG does not match Pulsenote::VERSION $SRC"
            exit 1
          fi
          echo "Version $SRC matches the tag."

  # Publishing itself is Packagist's GitHub webhook — no token needed here. If the
  # package is ever hosted somewhere without a webhook, add the push step below.
